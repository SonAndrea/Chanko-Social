spring:
  application:
    name: chanko-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chanko}
    username: ${POSTGRES_USER:chanko}
    password: ${POSTGRES_PASSWORD:chanko}

  jpa:
    open-in-view: false        # keeps database queries out of the web layer
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks it

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true        # JS can't read the session cookie
        same-site: lax         # not sent on cross-site POSTs (CSRF protection; see SecurityConfig)
        # secure: true         # enable once served over HTTPS

management:
  endpoints:
    web:
      exposure:
        include: health,info
